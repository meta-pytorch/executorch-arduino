# Regenerate this library from an ExecuTorch checkout and open a pull request
# with the result.
#
# Everything under src/ and examples/ is generated. This workflow is the only
# thing that should write them; a hand edit is lost on the next sync.
#
# Lives here rather than in pytorch/executorch because a same-repo pull request
# needs only GITHUB_TOKEN, while a cross-repo one would need a stored PAT.

name: Sync from ExecuTorch

on:
  workflow_dispatch:
    inputs:
      executorch_ref:
        description: 'ExecuTorch ref to generate from (branch, tag, or SHA)'
        required: false
        default: 'main'
      bump:
        description: 'Version bump: patch, minor, major, or none'
        required: false
        default: 'patch'
  repository_dispatch:
    types: [executorch-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout this library
        uses: actions/checkout@v4

      - name: Resolve ExecuTorch ref
        id: ref
        run: |
          REF="${{ github.event.inputs.executorch_ref || github.event.client_payload.ref || 'main' }}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout ExecuTorch
        uses: actions/checkout@v4
        with:
          repository: pytorch/executorch
          ref: ${{ steps.ref.outputs.ref }}
          path: executorch
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The exporter and the runtime must come from the same commit. A model
      # exported against a different one loads, resolves every operator, then
      # fails inside Method::execute with InvalidProgram (0x23).
      - name: Install ExecuTorch
        working-directory: executorch
        run: ./install_executorch.sh

      # build_arduino_library.sh refuses to run without the generated schema
      # headers, which only a cmake configure+build produces.
      - name: Build schema headers
        working-directory: executorch
        run: |
          cmake -B cmake-out -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-out --target program_schema -j"$(nproc)"

      - name: Generate the library
        working-directory: executorch/examples/arduino
        run: ./build_arduino_library.sh

      - name: Verify the example models match the generated runtime
        working-directory: executorch/examples/arduino
        run: python verify_models.py arduino_lib/ExecuTorch

      # Promote the generated tree to this repo's root: the Library Manager only
      # reads the root library.properties, so the library cannot live in a
      # subdirectory. --delete is what removes sources that upstream dropped.
      - name: Promote generated tree to the repository root
        run: |
          GEN="executorch/examples/arduino/arduino_lib/ExecuTorch"
          test -d "${GEN}/src" || { echo "ERROR: ${GEN}/src missing; the build did not produce a library."; exit 1; }
          for path in src examples extras; do
            rm -rf "./${path}"
            cp -r "${GEN}/${path}" "./${path}"
          done
          cp "${GEN}/library.properties" ./library.properties
          cp "${GEN}/executorch_pin.txt" ./executorch_pin.txt
          rm -rf executorch

      - name: Bump version
        if: ${{ github.event.inputs.bump != 'none' }}
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          CURRENT=$(grep '^version=' library.properties | cut -d= -f2)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "unknown bump: $BUMP"; exit 1 ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          sed -i "s/^version=.*/version=${NEW}/" library.properties
          echo "version=${NEW}" >> "$GITHUB_ENV"
          echo "Version: ${CURRENT} -> ${NEW}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/executorch-${{ steps.ref.outputs.ref }}
          title: 'Sync from ExecuTorch ${{ steps.ref.outputs.ref }}'
          commit-message: |
            Regenerate from ExecuTorch ${{ steps.ref.outputs.ref }}

            Generated by .github/workflows/sync.yml. Everything under src/ and
            examples/ is build output; see extras/PROVENANCE.txt for the exact
            ExecuTorch commit and CMSIS-NN revision it came from.
          body: |
            Regenerated by `.github/workflows/sync.yml` from
            ExecuTorch `${{ steps.ref.outputs.ref }}`.

            `src/` and `examples/` are generated. Do not review them line by line —
            the signal is CI plus `executorch_pin.txt` and `extras/PROVENANCE.txt`.

            Review order:
            1. `executorch_pin.txt` and `library.properties` — the pin moved, and the
               version advanced (the registry rejects a tag reusing an indexed version).
            2. `extras/PROVENANCE.txt` — ExecuTorch commit, CMSIS-NN revision, op set,
               kernel count. A surprise here means the build inputs changed.
            3. CI — every example compiled for every board, and `arduino-lint`
               passed as a Library Manager submission.

            The example models were re-exported in this same run, so they match the
            runtime they ship with.

            To publish: merge, then tag. The registry indexes tags only, and requires
            the tagged tree to be fully compliant.
          labels: generated
          delete-branch: true
